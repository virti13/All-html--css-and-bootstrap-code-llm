<!DOCTYPE html>
<html>

<head>
    <title>CSS Typography</title>

    <style>
        h1 {
            font-family: Arial;
            font-size: 40px;
            font-weight: bold;
            color: blue;
            text-align: center;
        }

        p {
            font-family: Georgia;
            font-size: 20px;
            font-style: italic;
            line-height: 1.5;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <h1>CSS Typography</h1>

    <p>
        Typography is used to style and arrange text on a webpage.
    </p>

</body>

</html>
