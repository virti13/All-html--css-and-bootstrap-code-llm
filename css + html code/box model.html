<!DOCTYPE html>
<html>

<head>
    <title>CSS Box Model</title>

    <style>
        /* The main box */
        .box {
            width: 200px;
            height: 100px;

            /* Space inside the box */
            padding: 20px;

            /* Border around the box */
            border: 5px solid black;

            /* Space outside the box */
            margin: 30px;

            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        This is the content of the box.
    </div>

</body>

</html>
