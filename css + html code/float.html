<!DOCTYPE html>
<html>

<head>
    <title>CSS Example</title>

    <style>
        /* Float */
        .box {
            float: left;
            width: 100px;
            height: 100px;
            background-color: lightblue;
            margin: 10px;
        }

        /* Gradient */
        .gradient {
            background: linear-gradient(to right, blue, pink);
            padding: 20px;
            color: white;
        }

        /* Hover */
        button:hover {
            background-color: green;
            color: white;
        }

        /* Focus */
        input:focus {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <h1>CSS Examples</h1>

    <!-- Float -->
    <div class="box">Float</div>

    <p>This text appears beside the floated box.</p>

    <br><br><br>

    <!-- Gradient -->
    <div class="gradient">
        Gradient Background
    </div>

    <br>

    <!-- Hover -->
    <button>Move Mouse Over Me</button>

    <br><br>

    <!-- Focus -->
    <input type="text" placeholder="Click here">

</body>

</html>
