<!DOCTYPE html>
<html>

<head>
    <title>Inline and Internal CSS</title>

    <!-- Internal CSS -->
    <style>
        p {
            color: blue;
            font-size: 20px;
        }

        button {
            background-color: green;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color: red; text-align: center;">
        Welcome to CSS
    </h1>

    <p>
        This paragraph uses Internal CSS.
    </p>

    <button>
        Click Me
    </button>

</body>

</html>
