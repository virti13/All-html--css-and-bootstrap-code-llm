<!DOCTYPE html>
<html>

<head>
    <title>CSS Selectors</title>

    <style>
        /* Universal Selector */
        * {
            font-family: Arial;
        }

        /* Element Selector */
        p {
            color: blue;
        }

        /* Class Selector */
        .highlight {
            background-color: yellow;
        }

        /* ID Selector */
        #heading {
            color: green;
        }

        /* Grouping Selector */
        h2,
        h3 {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1 id="heading">Welcome to My Website</h1>

    <h2>CSS Selectors</h2>

    <p>This paragraph uses an element selector.</p>

    <p class="highlight">
        This paragraph uses a class selector.
    </p>

    <h3>Learning CSS is Fun!</h3>

</body>

</html>
