<!DOCTYPE html>
<html>

<head>
    <title>Opacity and Selectors</title>

    <style>
        /* Element Selector */
        p {
            color: blue;
        }

        /* Class Selector */
        .box {
            background-color: orange;
            padding: 20px;
        }

        /* ID Selector */
        #heading {
            color: red;
        }

        /* Opacity */
        .transparent {
            opacity: 0.5;
        }

        /* Universal Selector */
        * {
            font-family: Arial;
        }
    </style>
</head>

<body>

    <h1 id="heading">CSS Selectors</h1>

    <p>This uses an Element Selector.</p>

    <div class="box">
        This uses a Class Selector.
    </div>

    <br>

    <div class="transparent box">
        This box has 50% opacity.
    </div>

</body>

</html>
