<!DOCTYPE html>
<html>

<head>
    <title>CSS Effects</title>

    <style>
        /* Text Decoration */
        .underline {
            text-decoration: underline;
        }

        /* Text Shadow */
        .shadow {
            text-shadow: 2px 2px 4px gray;
        }

        /* Box Shadow */
        .box {
            width: 150px;
            padding: 20px;
            background-color: lightblue;
            box-shadow: 5px 5px 10px gray;
        }

        /* Transform */
        .transform {
            width: 150px;
            padding: 20px;
            background-color: lightgreen;
            transform: rotate(10deg);
        }
    </style>
</head>

<body>

    <h1 class="underline">Text Decoration</h1>

    <h2 class="shadow">Text Shadow</h2>

    <div class="box">
        Box Shadow
    </div>

    <br><br><br>

    <div class="transform">
        Transform
    </div>

</body>

</html>
