<!DOCTYPE html>
<html>

<head>
    <title>Lists and Tables</title>
</head>

<body>

    <h1>HTML Lists</h1>

    <!-- Unordered List -->
    <h2>My Hobbies</h2>

    <ul>
        <li>Reading</li>
        <li>Playing Games</li>
        <li>Drawing</li>
        <li>Listening to Music</li>
    </ul>

    <!-- Ordered List -->
    <h2>My Daily Routine</h2>

    <ol>
        <li>Wake up</li>
        <li>Have breakfast</li>
        <li>Go to school</li>
        <li>Study</li>
    </ol>


    <h1>Student Table</h1>

    <!-- Table -->
    <table border="1">

        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Grade</th>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>12</td>
            <td>7</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>13</td>
            <td>8</td>
        </tr>

        <tr>
            <td>Aarav</td>
            <td>11</td>
            <td>6</td>
        </tr>

    </table>

</body>

</html>
